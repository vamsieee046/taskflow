<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskFlow</title>
<style>
  :root {
    --bg: #eef1f4; --panel: #ffffff; --ink: #18212b; --muted: #5d6b79; --line: #d3dae1;
    --accent: #1f5eff; --accent-ink: #ffffff; --danger: #b3261e; --done: #8a97a4;
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11161c; --panel: #1a222b; --ink: #e7ecf1; --muted: #93a1af; --line: #2c3743;
            --accent: #6f9bff; --accent-ink: #0b1220; --danger: #ff8a80; --done: #6b7886; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5; }
  main { max-width: 34rem; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
  h1 { font-size: 2.25rem; letter-spacing: -0.02em; margin: 0 0 .25rem; }
  .sub { color: var(--muted); margin: 0 0 2rem; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1.25rem; }
  form { display: flex; gap: .5rem; flex-wrap: wrap; }
  input[type=text], input[type=email], input[type=password] {
    flex: 1 1 12rem; padding: .65rem .75rem; font: inherit; color: inherit;
    background: transparent; border: 1px solid var(--line); border-radius: 6px; }
  button { font: inherit; cursor: pointer; border-radius: 6px; padding: .65rem 1rem;
    border: 1px solid var(--line); background: transparent; color: var(--ink); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; align-items: center; gap: .75rem; padding: .7rem 0; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; }
  .row span { flex: 1; word-break: break-word; }
  .row.done span { color: var(--done); text-decoration: line-through; }
  .row button { padding: .3rem .6rem; color: var(--danger); }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .msg { min-height: 1.5rem; margin: .75rem 0 0; color: var(--danger); font-size: .95rem; }
  .msg.ok { color: var(--muted); }
  .empty { color: var(--muted); padding: .5rem 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>TaskFlow</h1>
  <p class="sub">Tasks you can reach from anywhere, behind your own login.</p>

  <section id="auth" class="panel">
    <form id="auth-form">
      <input id="email" type="email" placeholder="Email" autocomplete="email" required>
      <input id="password" type="password" placeholder="Password (8+ characters)" autocomplete="current-password" minlength="8" required>
      <button class="primary" type="submit" data-mode="login">Log in</button>
      <button type="submit" data-mode="signup">Create account</button>
    </form>
    <p id="auth-msg" class="msg" role="status"></p>
  </section>

  <section id="app" class="panel" hidden>
    <div class="bar"><strong id="count"></strong><button id="logout" type="button">Log out</button></div>
    <form id="task-form">
      <input id="title" type="text" placeholder="What needs doing?" maxlength="200" required>
      <button class="primary" type="submit">Add task</button>
    </form>
    <p id="app-msg" class="msg" role="status"></p>
    <div id="list"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem("token");

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
  });
  if (res.status === 401 && token) { logout(); throw new Error("Session expired. Log in again."); }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(typeof body.detail === "string" ? body.detail : "Request failed (" + res.status + ")");
  }
  return res.status === 204 ? null : res.json();
}

function show(loggedIn) { $("auth").hidden = loggedIn; $("app").hidden = !loggedIn; }
function logout() { token = null; sessionStorage.removeItem("token"); show(false); }

let mode = "login";
document.querySelectorAll("#auth-form button").forEach((b) => b.addEventListener("click", () => (mode = b.dataset.mode)));

$("auth-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("auth-msg"); msg.className = "msg"; msg.textContent = "";
  try {
    const data = await api("/auth/" + mode, { method: "POST",
      body: JSON.stringify({ email: $("email").value, password: $("password").value }) });
    if (data.access_token) {
      token = data.access_token; sessionStorage.setItem("token", token);
      $("password").value = ""; show(true); await load();
    } else { msg.className = "msg ok"; msg.textContent = data.message; }
  } catch (err) { msg.textContent = err.message; }
});

$("logout").addEventListener("click", logout);

$("task-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    await api("/tasks", { method: "POST", body: JSON.stringify({ title: $("title").value }) });
    $("title").value = ""; await load();
  } catch (err) { $("app-msg").textContent = err.message; }
});

async function load() {
  $("app-msg").textContent = "";
  try {
    const tasks = await api("/tasks");
    const open = tasks.filter((t) => !t.done).length;
    $("count").textContent = open + " open, " + (tasks.length - open) + " done";
    const list = $("list"); list.replaceChildren();
    if (!tasks.length) { const p = document.createElement("p"); p.className = "empty"; p.textContent = "No tasks yet. Add your first one above."; list.append(p); }
    for (const t of tasks) {
      const row = document.createElement("div"); row.className = "row" + (t.done ? " done" : "");
      const box = document.createElement("input"); box.type = "checkbox"; box.checked = t.done;
      box.setAttribute("aria-label", "Mark done: " + t.title);
      box.addEventListener("change", async () => { await act(() => api("/tasks/" + t.id, { method: "PATCH", body: JSON.stringify({ done: box.checked }) })); });
      const label = document.createElement("span"); label.textContent = t.title;
      const del = document.createElement("button"); del.type = "button"; del.textContent = "Delete";
      del.addEventListener("click", () => act(() => api("/tasks/" + t.id, { method: "DELETE" })));
      row.append(box, label, del); list.append(row);
    }
  } catch (err) { $("app-msg").textContent = err.message; }
}
async function act(fn) { try { await fn(); await load(); } catch (err) { $("app-msg").textContent = err.message; } }

if (token) { show(true); load(); }
</script>
</body>
</html>
