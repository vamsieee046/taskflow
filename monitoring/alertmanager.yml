# Edit the SMTP settings (a Gmail app password works) before relying on email alerts.
route:
  receiver: email
  group_by: [alertname]
  group_wait: 30s
  repeat_interval: 4h
receivers:
  - name: email
    email_configs:
      - to: you@example.com
        from: alerts@example.com
        smarthost: smtp.gmail.com:587
        auth_username: you@example.com
        auth_password: YOUR_APP_PASSWORD
        send_resolved: true
