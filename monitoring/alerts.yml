groups:
  - name: taskflow
    rules:
      - alert: AppDown
        expr: up{job="taskflow"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "TaskFlow API is down"
          description: "Prometheus has not been able to scrape the app for 1 minute."

      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status="5xx"}[5m])) / sum(rate(http_requests_total[5m])) > 0.05
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "More than 5% of requests are failing with 5xx"

      - alert: SlowRequests
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "p95 latency is above 1 second"

  - name: host
    rules:
      - alert: HighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Host memory above 90%"

      - alert: DiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/host"} / node_filesystem_size_bytes{mountpoint="/host"}) > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Disk above 85% full"
